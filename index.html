<!DOCTYPE html>
<html lang="en">`
<head>

    <title>MeteoApi Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body class="bg-light">
<div id="loader">
    <div class="text-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-2">Caricamento in corso...</p>
    </div>
</div>

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container-fluid justify-content-center">
        <span class="navbar-brand mb-0 h1">Meteo Local</span>
    </div>
</nav>

<main class="container">


    <div id="error-container" class="d-none"></div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-6">


            <div class="card shadow-sm text-center p-4">
                <div class="card-body">
                    <h2 id="current-date" class="h5 text-muted mb-3">Caricamento data...</h2>


                    <div class="mb-3">
                        <i id="weather-icon" class="bi bi-cloud-sun text-primary" style="font-size: 4rem;"></i>
                    </div>

                    <h1 id="current-temp" class="display-1 fw-bold">--°C</h1>
                    <p class="text-secondary">Posizione attuale</p>
                </div>
            </div>


            <div class="row mt-3 text-center">
                <div class="col-12">
                    <div class="card shadow-sm p-3">
                        <p id="wind-speed" class="mb-0 text-muted">Vento: -- km/h</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<footer class="text-center py-4 text-muted">
    <small>Dati forniti da Open-Meteo API</small>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/main.js" type="module"></script>
</body>
</html>
